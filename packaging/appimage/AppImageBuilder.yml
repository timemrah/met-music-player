# MET Music Player — AppImage tarifi (appimage-builder)
#
# Yerel derleme (Ubuntu 24.04 önerilir):
#   cd packaging/appimage && appimage-builder --recipe AppImageBuilder.yml --skip-test
#
# NOTLAR:
# - Ubuntu 24.04 tabanlıdır; GTK 4.14 içerir (Gtk.FileDialog 4.10+ gerektirir).
# - glibc 2.39 gömülür: Debian 13 / güncel Fedora / güncel Arch'ta çalışır.
#   Daha eski dağıtımlarda çalışmayabilir; oralar için .deb/.rpm kullanın.
# - Sürüm numarası release sırasında CI tarafından etiketten yazılır
#   (aşağıdaki `version:` satırına dokunmayın, sed desenine bağlıdır).
version: 1

script:
  # Bu dizinden çalıştırılır: packaging/appimage
  - rm -rf AppDir | true
  - mkdir -p AppDir/usr/share/met-music-player AppDir/usr/share/icons/hicolor/scalable/apps
  - cp ../../main.py AppDir/usr/share/met-music-player/
  - cp ../../logo.svg AppDir/usr/share/icons/hicolor/scalable/apps/mp3-player.svg

AppDir:
  path: ./AppDir

  app_info:
    id: com.emrah.mp3player
    name: MET Music Player
    icon: mp3-player
    version: 1.0.0
    exec: usr/bin/python3
    exec_args: "$APPDIR/usr/share/met-music-player/main.py $@"

  apt:
    arch: amd64
    sources:
      - sourceline: 'deb [arch=amd64] http://archive.ubuntu.com/ubuntu/ noble main restricted universe multiverse'
        key_url: 'http://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C'
      - sourceline: 'deb [arch=amd64] http://archive.ubuntu.com/ubuntu/ noble-updates main restricted universe multiverse'
        key_url: 'http://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C'
    include:
      - python3
      - python3-gi
      - gir1.2-gtk-4.0
      - gir1.2-adw-1
      - gir1.2-gstreamer-1.0
      - libgtk-4-1
      - libadwaita-1-0
      - librsvg2-common
      - adwaita-icon-theme
      - hicolor-icon-theme
      - gstreamer1.0-plugins-base
      - gstreamer1.0-plugins-good
      - gstreamer1.0-plugins-bad
      - gstreamer1.0-plugins-ugly
      - gstreamer1.0-pulseaudio
      - gstreamer1.0-pipewire
      - gstreamer1.0-alsa
      - python3-mutagen
    exclude:
      - usr/share/man
      - usr/share/doc

  runtime:
    env:
      PYTHONHOME: '${APPDIR}/usr'
      PYTHONPATH: '${APPDIR}/usr/lib/python3/dist-packages'

AppImage:
  arch: x86_64
  update-information: 'gh-releases-zsync|timemrah|met-music-player|latest|MET-Music-Player-*x86_64.AppImage.zsync'
  sign-key: None
